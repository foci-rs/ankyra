[package]
name = "ankyra-assemble"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Proc-macro terminal for ankyra's CPS-chain protocol assembler."

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
ankyra-codegen = { path = "../ankyra-codegen", version = "0.1.0" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-error2 = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# `end_to_end.rs` exercises the terminal assembler by actually running
# `ankyra_config!` end-to-end, so we need both the runtime crate (for
# `Transport`, `TransportOutput`, `SliceInputBuffer`, etc.) and the
# user-facing macro crate (for `#[klipper_command]`, `#[klipper_reply]`,
# `ankyra_provider!`) as test-only dependencies. Neither is needed for the
# proc-macro compilation itself.
ankyra = { path = "../ankyra", version = "0.1.0" }
ankyra-macros = { path = "../ankyra-macros", version = "0.1.0" }
# `flate2` decodes zlib-framed `identify_response` payloads in the
# round-trip test so the assertion is verifying Klipper's actual wire
# contract, not ankyra's own encoder.
flate2 = "1"
