[package]
name = "ankyra-assemble"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Proc-macro terminal for ankyra's CPS-chain protocol assembler."

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-error2 = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
